<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mini-dokon | Онлайн-магазин</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

  <!-- Навигация -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-200 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        
        <!-- Логотип -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/30">
            <i class="fa-solid fa-store"></i>
          </div>
          <div>
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-brand-600 to-emerald-500 bg-clip-text text-transparent">mini-dokon</span>
            <span class="block text-[10px] uppercase font-semibold tracking-wider text-gray-400 -mt-1">маркетплейс</span>
          </div>
        </div>

        <!-- Поиск (Десктоп) -->
        <div class="hidden md:flex flex-1 max-w-md mx-4 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="searchInput" placeholder="Поиск товаров..." 
            class="w-full pl-10 pr-4 py-2 text-sm bg-gray-100 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 focus:border-brand-500 dark:focus:border-brand-500 focus:outline-none transition-all">
        </div>

        <!-- Кнопки справа -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Тёмная тема -->
          <button id="themeToggle" class="p-2.5 text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-xl transition-colors" title="Сменить тему">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:inline"></i>
          </button>

          <!-- Корзина кнопка -->
          <button id="openCartBtn" class="relative flex items-center gap-2 px-3.5 py-2 bg-brand-500 hover:bg-brand-600 text-white font-medium text-sm rounded-xl transition-all shadow-md shadow-brand-500/20 active:scale-95">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="hidden sm:inline">Корзина</span>
            <span id="cartBadge" class="bg-white text-brand-700 font-bold text-xs px-2 py-0.5 rounded-full shadow-sm">0</span>
          </button>
        </div>
      </div>

      <!-- Поиск (Мобильный) -->
      <div class="pb-3 md:hidden">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="mobileSearchInput" placeholder="Поиск товаров..." 
            class="w-full pl-10 pr-4 py-2 text-sm bg-gray-100 dark:bg-slate-800 border border-transparent dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 focus:border-brand-500 focus:outline-none transition-all">
        </div>
      </div>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    
    <!-- Категории -->
    <div class="flex items-center gap-2 overflow-x-auto pb-4 custom-scrollbar mb-6" id="categoriesContainer">
      <!-- Динамически заполняется -->
    </div>

    <!-- Список товаров -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-6" id="productsGrid">
      <!-- Динамически заполняется -->
    </div>

    <!-- Пустое состояние -->
    <div id="emptyProducts" class="hidden text-center py-16">
      <div class="w-16 h-16 bg-gray-100 dark:bg-slate-800 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-box-open"></i>
      </div>
      <h3 class="text-lg font-semibold mb-1">Ничего не найдено</h3>
      <p class="text-gray-500 dark:text-slate-400 text-sm">Попробуйте изменить поисковый запрос или категорию</p>
    </div>
  </main>

  <!-- Боковая панель корзины -->
  <div id="cartModal" class="fixed inset-0 z-50 invisible opacity-0 transition-opacity duration-300">
    <!-- Оверлей -->
    <div id="cartOverlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

    <!-- Сама панель -->
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white dark:bg-slate-900 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-out" id="cartPanel">
      
      <!-- Шапка корзины -->
      <div class="p-4 sm:p-6 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-basket-shopping text-brand-500 text-xl"></i>
          <h2 class="text-lg font-bold">Корзина</h2>
          <span id="cartTotalItems" class="text-xs bg-gray-100 dark:bg-slate-800 px-2 py-0.5 rounded-full text-gray-500 dark:text-slate-400">0 шт</span>
        </div>
        <button id="closeCartBtn" class="p-2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Список товаров корзины -->
      <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 custom-scrollbar" id="cartItemsContainer">
        <!-- Динамически заполняется -->
      </div>

      <!-- Футер корзины -->
      <div class="p-4 sm:p-6 border-t border-gray-100 dark:border-slate-800 bg-gray-50/50 dark:bg-slate-900/50 space-y-4">
        <div class="space-y-1.5 text-sm">
          <div class="flex justify-between text-gray-500 dark:text-slate-400">
            <span>Товары (<span id="summaryCount">0</span>):</span>
            <span id="summarySubtotal">0 сум</span>
          </div>
          <div class="flex justify-between text-gray-500 dark:text-slate-400">
            <span>Доставка:</span>
            <span class="text-brand-600 dark:text-brand-500 font-medium">Бесплатно</span>
          </div>
          <div class="flex justify-between font-bold text-lg text-slate-900 dark:text-white pt-2 border-t border-gray-200 dark:border-slate-800">
            <span>Итого:</span>
            <span id="summaryTotal" class="text-brand-600 dark:text-brand-500">0 сум</span>
          </div>
        </div>

        <button id="checkoutBtn" class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-xl transition-all shadow-lg shadow-brand-500/25 active:scale-[0.98]">
          Оформить заказ
        </button>
      </div>
    </div>
  </div>

  <!-- Модальное окно оформления -->
  <div id="checkoutModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div id="checkoutOverlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
    
    <div class="relative bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-100 dark:border-slate-800 z-10 max-h-[90vh] overflow-y-auto custom-scrollbar">
      <button id="closeCheckoutBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-slate-200">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <h3 class="text-xl font-bold mb-4">Детали заказа</h3>

      <form id="orderForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Имя</label>
          <input type="text" required placeholder="Алишер Навои" class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:border-brand-500 focus:outline-none transition-colors text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Телефон</label>
          <input type="tel" required placeholder="+998 90 123 45 67" class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:border-brand-500 focus:outline-none transition-colors text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Адрес доставки</label>
          <textarea required rows="2" placeholder="г. Ташкент, ул. Амира Тимура..." class="w-full px-3.5 py-2.5 bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl focus:border-brand-500 focus:outline-none transition-colors text-sm resize-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Способ оплаты</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="border border-gray-200 dark:border-slate-700 rounded-xl p-3 flex items-center gap-2 cursor-pointer hover:border-brand-500 transition-colors">
              <input type="radio" name="payment" value="click" checked class="text-brand-500 focus:ring-brand-500">
              <span class="text-sm font-medium">Click / Payme</span>
            </label>
            <label class="border border-gray-200 dark:border-slate-700 rounded-xl p-3 flex items-center gap-2 cursor-pointer hover:border-brand-500 transition-colors">
              <input type="radio" name="payment" value="cash" class="text-brand-500 focus:ring-brand-500">
              <span class="text-sm font-medium">Наличными</span>
            </label>
          </div>
        </div>

        <div class="pt-4 border-t border-gray-100 dark:border-slate-800 flex justify-between items-center">
          <div>
            <div class="text-xs text-gray-400">К оплате:</div>
            <div id="checkoutTotal" class="text-lg font-bold text-brand-600 dark:text-brand-500">0 сум</div>
          </div>
          <button type="submit" class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl transition-all shadow-md shadow-brand-500/20">
            Подтвердить заказ
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Уведомления (Toast) -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <!-- JavaScript -->
  <script>
    // Данные товаров
    const PRODUCTS = [
      { id: 1, name: 'Молоко 3.2% 1Л', price: 12000, category: 'dairy', image: 'https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=400&q=80' },
      { id: 2, name: 'Свежий багет', price: 6000, category: 'bakery', image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=400&q=80' },
      { id: 3, name: 'Яблоки красные 1кг', price: 18000, category: 'fruits', image: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=400&q=80' },
      { id: 4, name: 'Кока-Кола 1.5Л', price: 14000, category: 'drinks', image: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=400&q=80' },
      { id: 5, name: 'Сыр Гауда 200г', price: 28000, category: 'dairy', image: 'https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?auto=format&fit=crop&w=400&q=80' },
      { id: 6, name: 'Бананы 1кг', price: 22000, category: 'fruits', image: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=400&q=80' },
      { id: 7, name: 'Кофе молотый 250г', price: 45000, category: 'drinks', image: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=400&q=80' },
      { id: 8, name: 'Круассан с шоколадом', price: 9000, category: 'bakery', image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=400&q=80' },
    ];

    const CATEGORIES = [
      { id: 'all', name: 'Все товары', icon: 'fa-border-all' },
      { id: 'dairy', name: 'Молочные', icon: 'fa-cheese' },
      { id: 'bakery', name: 'Выпечка', icon: 'fa-bread-slice' },
      { id: 'fruits', name: 'Фрукты', icon: 'fa-apple-whole' },
      { id: 'drinks', name: 'Напитки', icon: 'fa-bottle-water' },
    ];

    // Состояние приложения
    let state = {
      cart: JSON.parse(localStorage.getItem('mini_dokon_cart') || '[]'),
      activeCategory: 'all',
      searchQuery: '',
    };

    // Форматирование суммы
    function formatPrice(price) {
      return price.toLocaleString('ru-RU') + ' сум';
    }

    // Сохранение корзины
    function saveCart() {
      localStorage.setItem('mini_dokon_cart', JSON.stringify(state.cart));
      updateCartUI();
    }

    // Уведомления
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm transform transition-all duration-300 translate-y-5 opacity-0 pointer-events-auto';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-brand-500"></i><span>${message}</span>`;
      
      const container = document.getElementById('toastContainer');
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-5', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Отрисовка категорий
    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = CATEGORIES.map(cat => {
        const isActive = state.activeCategory === cat.id;
        return `
          <button 
            onclick="setCategory('${cat.id}')"
            class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all ${
              isActive 
                ? 'bg-brand-500 text-white shadow-md shadow-brand-500/20' 
                : 'bg-white dark:bg-slate-800 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-700'
            }"
          >
            <i class="fa-solid ${cat.icon}"></i>
            <span>${cat.name}</span>
          </button>
        `;
      }).join('');
    }

    function setCategory(id) {
      state.activeCategory = id;
      renderCategories();
      renderProducts();
    }

    // Отрисовка товаров
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const empty = document.getElementById('emptyProducts');

      const filtered = PRODUCTS.filter(p => {
        const matchesCat = state.activeCategory === 'all' || p.category === state.activeCategory;
        const matchesSearch = p.name.toLowerCase().includes(state.searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(p => {
        const cartItem = state.cart.find(item => item.id === p.id);
        const qty = cartItem ? cartItem.quantity : 0;

        return `
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-3 sm:p-4 border border-gray-100 dark:border-slate-800 flex flex-col justify-between hover:shadow-xl transition-all duration-300 group">
            <div>
              <div class="relative aspect-square rounded-xl overflow-hidden bg-gray-100 dark:bg-slate-700 mb-3">
                <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
              </div>
              <h3 class="font-semibold text-sm sm:text-base line-clamp-2 mb-1">${p.name}</h3>
              <p class="text-brand-600 dark:text-brand-500 font-bold text-sm sm:text-lg">${formatPrice(p.price)}</p>
            </div>

            <div class="mt-3 pt-3 border-t border-gray-50 dark:border-slate-700/50">
              ${qty === 0 ? `
                <button onclick="addToCart(${p.id})" class="w-full py-2 bg-gray-100 dark:bg-slate-700 hover:bg-brand-500 hover:text-white dark:hover:bg-brand-500 text-slate-700 dark:text-slate-200 font-medium text-xs sm:text-sm rounded-xl transition-colors flex items-center justify-center gap-2">
                  <i class="fa-solid fa-plus"></i> В корзину
                </button>
              ` : `
                <div class="flex items-center justify-between bg-brand-50 dark:bg-slate-700/60 rounded-xl p-1">
                  <button onclick="updateQuantity(${p.id}, -1)" class="w-7 h-7 bg-white dark:bg-slate-600 rounded-lg flex items-center justify-center text-xs font-bold shadow-sm hover:bg-gray-100 dark:hover:bg-slate-500 active:scale-95 transition-all">
                    <i class="fa-solid fa-minus"></i>
                  </button>
                  <span class="font-bold text-xs sm:text-sm px-2">${qty}</span>
                  <button onclick="updateQuantity(${p.id}, 1)" class="w-7 h-7 bg-brand-500 text-white rounded-lg flex items-center justify-center text-xs font-bold shadow-sm hover:bg-brand-600 active:scale-95 transition-all">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    // Управление корзиной
    function addToCart(id) {
      const product = PRODUCTS.find(p => p.id === id);
      state.cart.push({ ...product, quantity: 1 });
      saveCart();
      renderProducts();
      showToast(`${product.name} добавлен в корзину`);
    }

    function updateQuantity(id, change) {
      const item = state.cart.find(p => p.id === id);
      if (!item) return;

      item.quantity += change;
      if (item.quantity <= 0) {
        state.cart = state.cart.filter(p => p.id !== id);
      }
      saveCart();
      renderProducts();
    }

    function updateCartUI() {
      const totalItems = state.cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      document.getElementById('cartBadge').innerText = totalItems;
      document.getElementById('cartTotalItems').innerText = `${totalItems} шт`;
      document.getElementById('summaryCount').innerText = totalItems;
      document.getElementById('summarySubtotal').innerText = formatPrice(totalPrice);
      document.getElementById('summaryTotal').innerText = formatPrice(totalPrice);
      document.getElementById('checkoutTotal').innerText = formatPrice(totalPrice);

      const checkoutBtn = document.getElementById('checkoutBtn');
      checkoutBtn.disabled = state.cart.length === 0;

      const container = document.getElementById('cartItemsContainer');
      if (state.cart.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-400">
            <i class="fa-solid fa-basket-shopping text-4xl mb-3 block"></i>
            <p class="text-sm">Ваша корзина пуста</p>
          </div>
        `;
        return;
      }

      container.innerHTML = state.cart.map(item => `
        <div class="flex gap-3 bg-gray-50 dark:bg-slate-800/50 p-3 rounded-xl items-center border border-gray-100 dark:border-slate-800">
          <img src="${item.image}" alt="${item.name}" class="w-14 h-14 object-cover rounded-lg">
          <div class="flex-1 min-w-0">
            <h4 class="font-medium text-xs sm:text-sm truncate">${item.name}</h4>
            <div class="text-brand-600 dark:text-brand-500 font-bold text-xs mt-0.5">${formatPrice(item.price)}</div>
          </div>
          <div class="flex items-center gap-1.5 bg-white dark:bg-slate-700 p-1 rounded-lg border border-gray-200 dark:border-slate-600">
            <button onclick="updateQuantity(${item.id}, -1)" class="w-5 h-5 flex items-center justify-center text-xs hover:text-brand-500">
              <i class="fa-solid fa-minus"></i>
            </button>
            <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
            <button onclick="updateQuantity(${item.id}, 1)" class="w-5 h-5 flex items-center justify-center text-xs hover:text-brand-500">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Управление модальными окнами
    const cartModal = document.getElementById('cartModal');
    const cartPanel = document.getElementById('cartPanel');
    const checkoutModal = document.getElementById('checkoutModal');

    function openCart() {
      cartModal.classList.remove('invisible', 'opacity-0');
      cartPanel.classList.remove('translate-x-full');
    }

    function closeCart() {
      cartPanel.classList.add('translate-x-full');
      cartModal.classList.add('opacity-0');
      setTimeout(() => cartModal.classList.add('invisible'), 300);
    }

    document.getElementById('openCartBtn').addEventListener('click', openCart);
    document.getElementById('closeCartBtn').addEventListener('click', closeCart);
    document.getElementById('cartOverlay').addEventListener('click', closeCart);

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      closeCart();
      checkoutModal.classList.remove('hidden');
    });

    document.getElementById('closeCheckoutBtn').addEventListener('click', () => {
      checkoutModal.classList.add('hidden');
    });
    document.getElementById('checkoutOverlay').addEventListener('click', () => {
      checkoutModal.classList.add('hidden');
    });

    // Обработка формы заказа
    document.getElementById('orderForm').addEventListener('submit', (e) => {
      e.preventDefault();
      checkoutModal.classList.add('hidden');
      state.cart = [];
      saveCart();
      renderProducts();
      showToast('Заказ успешно оформлен! Спасибо!');
    });

    // Поиск
    function handleSearch(e) {
      state.searchQuery = e.target.value;
      renderProducts();
    }
    document.getElementById('searchInput').addEventListener('input', handleSearch);
    document.getElementById('mobileSearchInput').addEventListener('input', handleSearch);

    // Темная тема
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    themeToggle.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    });

    // Инициализация
    renderCategories();
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
